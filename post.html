<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf8f3">
<title>Nooreva Journal</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="topline">Thoughtful finds for everyday living</div>

<header class="site-header">
<div class="wrap nav">
<a class="brand" href="index.html">noor<span class="dot">e</span>va.</a>

<nav class="navlinks" aria-label="Main navigation">
<a href="index.html">Home</a>
<a href="blog.html">Blog</a>
<a href="categories.html">Categories</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="navright">
<a class="btn" href="blog.html">← Back to journal</a>
<button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
</div>
</div>
</header>

<main class="section wrap">
<article id="article">
<p>Loading article…</p>
</article>
</main>

<footer class="footer">
<div class="wrap">
<div class="footer-bottom">
<span>© <span data-year>2026</span> Nooreva. All rights reserved.</span>
<a href="blog.html">Back to journal</a>
</div>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    document.querySelectorAll("[data-year]").forEach(el => {
        el.textContent = new Date().getFullYear();
    });

    const slug = new URLSearchParams(location.search).get("slug");
    const article = document.querySelector("#article");

    if (!slug) {
        article.innerHTML = '<p>Article not specified. <a href="blog.html">Return to journal</a>.</p>';
        return;
    }

    try {
        const url = "https://raw.githubusercontent.com/nooreva615/nooreva-website/main/blog-posts/" +
                    encodeURIComponent(slug) + ".md";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Article could not be found");
        }

        const content = await response.text();

        const match = content.match(/^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/);

        let meta = {};
        let body = content;

        if (match) {
            match[1].split("\n").forEach(line => {
                const separator = line.indexOf(":");

                if (separator !== -1) {
                    const key = line.slice(0, separator).trim();
                    const value = line.slice(separator + 1).trim();

                    meta[key] = value.replace(/^["']|["']$/g, "");
                }
            });

            body = match[2];
        }

        document.title = (meta.title || "Nooreva Journal") + " | Nooreva";

        article.innerHTML = `
            <div class="eyebrow">${meta.category || "Nooreva Journal"}</div>
            <h1>${meta.title || "Article"}</h1>
            <p class="article-meta">${meta.date || ""}</p>
            ${meta.image ? `<img src="${meta.image}" alt="" style="max-width:100%;border-radius:16px">` : ""}
            <div class="article-body">
                ${window.marked ? marked.parse(body) : body}
            </div>
            <p><a class="text-link" href="blog.html">← Back to journal</a></p>
        `;
    } catch (error) {
        article.innerHTML = '<p>Sorry, this article could not be loaded. <a href="blog.html">Return to journal</a>.</p>';
        console.error(error);
    }
});
</script>

</body>
</html>
